        kind: studio
        slug: destrozares
        release_date: 2016-11-18

      - title: "Mayéutica"
        year: 2021
        kind: studio
        slug: mayeutica

      - title: "Se nos lleva el aire"
        year: 2023            # corregido: era 2024, publicado el 15/12/2023
        kind: studio
        slug: se-nos-lleva-el-aire
        release_date: 2023-12-15

      - title: "Bienvenidos al temporal"
        year: 2018
        kind: live
        slug: bienvenidos-al-temporal
        release_date: 2018-11-30
        # Alta del barrido de discografía (01-08-2026). Directo de la gira de
        # «Destrozares», 9 cortes. Entra porque un directo son grabaciones
        # propias por definición. Verificado: MusicBrainz (Official,
        # El Dromedario Records, 9 pistas).
        # Tracklist en `album_tracks` enlazando a las canciones de estudio.

# ============================================================
# Notas de operación
# ============================================================
# 1. El script ingest.py debe usar `slug` como clave estable. Si
#    cambia el título por algún motivo, el slug NO debe cambiar.
# 2. Para album.kind in (live, compilation, single): NO se crean filas
#    `Song` nuevas. El tracklist vive en la tabla `album_tracks` y cada
#    corte enlaza a la canción ORIGINAL de estudio.
#    (Esta nota decía lo contrario —"crear filas nuevas"— hasta el
#    01-08-2026. Duplicar la canción pone en Google dos páginas casi
#    idénticas compitiendo entre sí: dar de alta los dos «Grandes éxitos
#    y fracasos» habría creado 33 páginas de canción, y 29 de esos cortes
#    ya estaban publicados. Es la misma cautela que ya defendía
#    infra/CATALOG_AUDIT_2D.md:66-69 para «Por la boca vive el pez».)
#    Un corte que no case con ninguna canción del catálogo se guarda con
#    su título tal cual y se deja SIN enlazar: no se adivina.
# 3. Excluido del corpus por decisión del usuario:
#    - Extrechinato y tú (2000)
#    - Iniciativa Sexual Yacumamba (proyecto de Iñaki, no Robe)
#    - Colaboraciones puntuales con otros artistas
