# ============================================================
# Discografía semilla para RobeLyrics
# ============================================================
# Fuente: conocimiento general + verificación cruzada en Genius
# y Wikipedia. Las entradas marcadas con `# verificar` requieren
# revisión humana antes de ejecutar el pipeline de ingesta —
# títulos exactos, años, y si Genius los indexa.
#
# kind ∈ {studio, live, compilation, ep}
# ============================================================

artists:
  - slug: extremoduro
    name: Extremoduro
    active_years: "1989-2014"
    albums:
      - title: "Tú en tu casa, nosotros en la hoguera"
        year: 1990
        kind: studio
        slug: tu-en-tu-casa-nosotros-en-la-hoguera
        # EL PRIMER ÁLBUM (Avispa, 1990), grabado en los Estudios M-20 a finales
        # de 1989 y hoy descatalogado tras la disputa con el sello. Alta automática
        # del Motor de Consenso (jul-2026): faltaba en el catálogo, y por eso
        # «Amor castúo» solo existía como versión en directo de 1997. Verificado
        # contra MusicBrainz (release-group be718ce7-d997-4547-a211-6a5c7d7deb88).

      - title: "Rock Transgresivo"
        year: 1994
        kind: studio
        slug: rock-transgresivo
        release_date: 1994-08-26
        # OJO: aquí figuraba 1989, que es la fecha de la MAQUETA (Estudios
        # Duplimatic, enero de 1989), no la de publicación. El álbum lo publicó DRO
        # el 26-08-1994: es el quinto, no el debut, y por eso aparecía mal ordenado
        # delante de «Tú en tu casa…». Comparte siete canciones con aquel porque la
        # banda no tenía los derechos de su primer disco y remezcló la maqueta con
        # tomas nuevas de Uoho. Verificado: Wikipedia ES + MusicBrainz
        # (release-group 4e2382f9-221b-3795-ba0d-02a64e76ff0d, 1994-08-26, DRO).
        # Contexto completo en data/reference/rock_transgresivo_y_tu_en_tu_casa.md

      - title: "Somos unos animales"
        year: 1991
        kind: ep
        slug: somos-unos-animales
        # verificar: a veces clasificado como EP/maxi, a veces como single
        # release_date pendiente: solo se conoce "julio de 1991", sin día.

      - title: "Deltoya"
        year: 1992
        kind: studio
        slug: deltoya
        # release_date pendiente: junio de 1992, día discrepante entre
        # fuentes (iTunes 08/06, Amazon 15/06). Sin confirmación oficial.

      - title: "¿Dónde están mis amigos?"
        year: 1993
        kind: studio
        slug: donde-estan-mis-amigos

      - title: "Pedrá"
        year: 1995
        kind: studio
        slug: pedra

      - title: "Agila"
        year: 1996
        kind: studio
        slug: agila

      - title: "Iros todos a tomar por culo"
        year: 1997
        kind: live
        slug: iros-todos-a-tomar-por-culo

      - title: "Canciones prohibidas"
        year: 1998
        kind: studio
        slug: canciones-prohibidas

      - title: "Yo, minoría absoluta"
        year: 2002
        kind: studio
        slug: yo-minoria-absoluta

      - title: "La ley innata"
        year: 2008
        kind: studio
        slug: la-ley-innata

      - title: "Material defectuoso"
        year: 2011
        kind: studio
        slug: material-defectuoso
        # verificar: tiene rarezas + tomas alternativas, en Genius puede
        # aparecer mezclado con singles sueltos

      - title: "Para todos los públicos"
        year: 2013
        kind: studio
        slug: para-todos-los-publicos

      - title: "Grandes éxitos y fracasos: Episodio primero"
        year: 2004
        kind: compilation
        slug: grandes-exitos-y-fracasos-episodio-primero
        release_date: 2004-05-03
        # Alta del barrido de discografía (01-08-2026). NO es la mitad de un
        # doble: Episodio primero y segundo son dos lanzamientos separados por
        # seis meses. Entra porque APORTA MATERIAL: cotejando los MBID de
        # grabación contra los originales, 6 de las 8 pistas cotejables son
        # tomas DISTINTAS — son regrabaciones, no un recopilatorio de sello.
        # Verificado: MusicBrainz release-group 03d1bbae-f590-3078-adbd-c41ae67fae4c
        # (Official, DRO, 15 pistas).
        # Su tracklist vive en `album_tracks` y enlaza a las canciones
        # originales: no crea páginas de canción propias (anti-canibalización).

      - title: "Grandes éxitos y fracasos: Episodio segundo"
        year: 2004
        kind: compilation
        slug: grandes-exitos-y-fracasos-episodio-segundo
        release_date: 2004-11-15
        # Mismo caso: 10 de 13 pistas cotejables son grabaciones distintas.
        # MusicBrainz release-group 96ca722e-0c7f-3f8a-9a04-ac0e99d3390a
        # (Official, DRO, 18 pistas).

  - slug: robe
    name: Robe Iniesta
    active_years: "2014-presente"
    albums:
