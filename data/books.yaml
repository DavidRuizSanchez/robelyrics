# Libros del universo Extremoduro/Robe — sección /libros.
# Metadatos bibliográficos VERIFICADOS (ISBN/editorial/año vía Alianza, Efe Eme,
# OpenLibrary y fichas de librería; portadas = cubierta oficial del producto por
# ISBN) + fichas curadas a mano (nunca inventadas ni generadas por LLM).
# Sembrado por scripts/seed_books.py (idempotente por slug), que ADEMÁS aplica:
#   - anti em-dash (strip_ai_tells) a todo texto,
#   - normalización de headings de body_md,
#   - guard de H1: el título no puede ser un término del core (extremoduro/robe).
# `buy_links` se rellenará al activar afiliados; la web aún NO renderiza compra.
#
# Campos: slug, title, subtitle, authors[], year, publisher, isbn, pages,
#   language, kind (biografia|ensayo|novela|monografico|poesia),
#   availability (new|secondhand|out_of_print), cover_url, cover_attribution,
#   summary, body_md, about[] (slugs de artista para tejer el @graph),
#   meta_title, meta_description, sort_order.

books:
  - slug: de-profundis
    title: "Extremoduro. De Profundis"
    subtitle: "La historia autorizada"
    authors: ["Javier Menéndez Flores"]
    year: 2013
    publisher: "Libros Cúpula"
    isbn: "9788448030841"
    pages: 595
    language: es
    kind: biografia
    availability: new
    cover_url: "https://m.media-amazon.com/images/P/8448030842.jpg"
    about: ["extremoduro", "robe"]
    sort_order: 10
    summary: >-
      La biografía autorizada de Extremoduro: la historia del grupo contada con
      el testimonio directo de Robe e Iñaki «Uoho» Antón.
    meta_title: "Extremoduro. De Profundis, la biografía autorizada · Entre Interiores"
    meta_description: >-
      La biografía autorizada de Extremoduro por Javier Menéndez Flores: qué
      cuenta «De Profundis», por qué importa y dónde situarla en la bibliografía
      del grupo.
    body_md: |
      ## Qué encontrarás
      *De Profundis* es la biografía **autorizada** de [Extremoduro](/extremoduro):
      Javier Menéndez Flores reconstruye la historia del grupo desde el Plasencia
      de los ochenta hasta la madurez sinfónica, con el testimonio directo de
      [Robe](/robe) e Iñaki «Uoho» Antón. Repasa la autofinanciación a base de
      boletos en el bar Simetría, la maqueta *Rock transgresivo*, el baile de
      formaciones de los primeros años y el salto por Avispa, DRO y Warner, disco
      a disco.

      ## Por qué importa
      Es la fuente de referencia para cualquier fan: al estar autorizada, recoge
      la voz de los protagonistas y fija fechas, anécdotas y zonas de sombra que
      las historias de oídas dan por sentadas. Se publicó por primera vez en 2013
      (Grijalbo), se amplió en 2022 (Libros Cúpula, la edición de 595 páginas) y
      tiene edición de bolsillo en 2025.

      ## El autor y su relación con Extremoduro
      Javier Menéndez Flores (Madrid, 1969) es periodista cultural (ha firmado en
      Rolling Stone, El Mundo y La Razón) y autor de una veintena de libros. Su
      vínculo con [Extremoduro](/extremoduro) es el más estrecho posible: *De
      Profundis* es la biografía **autorizada**, escrita con acceso directo a
      [Robe](/robe) e Iñaki «Uoho» Antón, así que aquí no hay rumor de oídas sino
      testimonio de primera mano.

      Es uno de los grandes biógrafos del rock y la canción en español. Ha
      dedicado varios libros a Joaquín Sabina (*Sabina. No amanece jamás*,
      *Perdonen la tristeza*) y ha escrito sobre Loquillo, Miguel Bosé y Dani
      Martín, el diccionario de la Movida *Madrid sí fue una fiesta* y la novela
      *Todos nosotros* (Premio Cartagena Negra 2021).

  - slug: el-viaje-intimo-de-la-locura
    title: "El viaje íntimo de la locura"
    subtitle: null
    authors: ["Roberto Iniesta"]
    year: 2009
    publisher: "Autoedición (Roberto Iniesta)"
    isbn: "9788461330010"
    language: es
    kind: novela
    availability: secondhand
    cover_url: "https://m.media-amazon.com/images/P/8461330013.jpg"
    cover_attribution: "Ilustración de portada: Diego LaTorre"
    about: ["robe"]
    sort_order: 20
    summary: >-
      La única novela de Robe: una fábula lírica, digresiva y simbólica donde el
      letrista de Extremoduro se revela como prosista.
    meta_title: "El viaje íntimo de la locura, la novela de Robe · Entre Interiores"
    meta_description: >-
      Ficha de «El viaje íntimo de la locura», la única novela de Roberto Iniesta
      (Robe). Estilo, símbolos compartidos con sus letras y datos de edición.
    body_md: |
      ## Qué encontrarás
      La única incursión de [Robe](/robe) en la narrativa larga. *El viaje íntimo
      de la locura* es una fábula de prosa poética (digresiva, metafórica y con
      humor negro) donde el Sol, la Luna, el viento, el río y los árboles son
      personajes con voluntad propia. La locura no aparece como patología, sino
      como puerta hacia otro conocimiento: el mismo *leitmotiv* que recorre sus
      letras.

      ## Por qué importa
      Demuestra que el poeta de [Extremoduro](/extremoduro) también es prosista:
      aforismo, paradoja, surrealismo lógico y ritmo musical en cada página. Los
      símbolos de la novela (sol, luna, viento, árbol, río) son los mismos que
      cruzan el cancionero, así que se lee como una llave para entrar en su
      universo.

      ## El autor: el propio Robe
      Aquí no hay intermediario: lo firma [Robe](/robe), Roberto Iniesta Ojea
      (Plasencia, 1962), cantante, guitarrista y compositor de
      [Extremoduro](/extremoduro) y, desde 2014, de su carrera en solitario. Toda
      su obra «escrita» vive en las letras de los discos (de *Rock transgresivo* a
      la trilogía *Lo que aletea en nuestras cabezas* / *Destrozares* /
      *Mayéutica*), y esta novela es su única incursión en la narrativa larga: la
      prueba de que su prosa late con el mismo pulso de poeta que sus versos.

      ## La edición
      Robe la autoeditó en 2009, tras unos tres años escribiéndola (y matriculado
      en la UNED para pulir la gramática). La ilustración de portada es de Diego
      LaTorre. Hoy está agotada en su tienda oficial y circula de segunda mano.

  - slug: talento-innato
    title: "Extremoduro. Talento innato"
    subtitle: "Biografía no autorizada"
    authors: ["Jesús Casañas López"]
