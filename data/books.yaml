    body_md: |
      ## Qué encontrarás
      Un cuaderno monográfico que la revista *Efe Eme* dedicó por entero a
      [Extremoduro](/extremoduro): artículos, análisis y memoria del grupo
      reunidos en un volumen publicado en el verano de 2022.

      ## Por qué importa
      Es una pieza para fans: recopila firmas y enfoques periodísticos sobre la
      banda en formato revista-libro. Al tratarse de un número de revista lleva
      depósito legal en lugar de ISBN, y quedan pocas unidades en circulación.

      ## La colección y las firmas
      *Cuadernos Efe Eme* es la línea de monográficos de la revista musical Efe
      Eme, dedicada a artistas y discos de referencia de la música en español.
      Este número 32 (verano de 2022) lleva a [Extremoduro](/extremoduro) en
      portada con un reportaje enciclopédico, *Todo lo que hay que saber*, firmado
      por varios redactores de la casa (de ahí el VV. AA.), y comparte páginas con
      reportajes sobre The Pretenders, Tim Buckley o Stanley Kubrick. No es obra de
      un único biógrafo, sino la mirada coral de una redacción especializada.
