    publisher: "Alianza Editorial"
    isbn: "9788411481922"
    language: es
    kind: biografia
    availability: new
    cover_url: "https://m.media-amazon.com/images/P/8411481921.jpg"
    about: ["extremoduro", "robe"]
    sort_order: 30
    summary: >-
      Biografía no autorizada de Extremoduro: un recorrido cronológico, disco a
      disco, por toda la trayectoria del grupo.
    meta_title: "Extremoduro. Talento innato (no autorizada) · Entre Interiores"
    meta_description: >-
      Ficha de «Extremoduro. Talento innato», la biografía no autorizada de Jesús
      Casañas (Alianza Editorial). Recorrido cronológico por la discografía del grupo.
    body_md: |
      ## Qué encontrarás
      *Talento innato* es una biografía **no autorizada** de
      [Extremoduro](/extremoduro) que ordena la trayectoria del grupo de forma
      cronológica, álbum por álbum, desde los inicios hasta la etapa en solitario
      de [Robe](/robe). A medio camino entre el relato periodístico y la biografía
      oral, recopila el contexto de cada disco, las giras y el relato externo de
      la banda.

      ## Por qué importa
      Al no ser autorizada, aporta la mirada del aficionado documentalista:
      complementa a *De Profundis* con el punto de vista de quien reconstruye la
      historia desde fuera. Publicada por Alianza Editorial en 2023 (colección
      Libros Singulares) y actualizada hasta 2025 en su segunda edición.

      ## El autor y su relación con Extremoduro
      Jesús Casañas López es periodista (licenciado en Economía y Periodismo) y
      músico. Escribe de rock en MondoSonoro y antes coordinó la revista Rock
      Estatal (2013-2015); además toca y canta en el grupo Palabras Necias. Su
      relación con [Extremoduro](/extremoduro) es la del cronista de fuera: a
      diferencia de la autorizada *De Profundis*, *Talento innato* es una biografía
      **no autorizada**, levantada desde la documentación y los testimonios
      recogidos, no desde el acceso directo a la banda.

      Fue su primer libro (2023). Después publicó *Héroes del Silencio. La chispa
      adecuada* (Alianza, 2024), siguiendo la misma fórmula de biografía musical
      con otra banda capital del rock en español.

  - slug: poesia-basica
    title: "Poesía básica"
    subtitle: "Extrechinato y Tú ensancha el alma"
    authors: ["Javier M. Alcaraz"]
    year: 2023
    publisher: "Efe Eme"
    isbn: "9788495749505"
    language: es
    kind: ensayo
    availability: new
    cover_url: "https://m.media-amazon.com/images/P/8495749505.jpg"
    about: ["robe", "extremoduro"]
    sort_order: 40
    summary: >-
      La historia del disco «Poesía básica» y del universo Extrechinato: Manolo
      Chinato, Robe, Fito y Uoho ensanchando el alma.
    meta_title: "Poesía básica. Extrechinato y Tú ensancha el alma · Entre Interiores"
    meta_description: >-
      Ficha del libro «Poesía básica» (Javier M. Alcaraz, Efe Eme): cómo Robe,
      Fito y Uoho musicalizaron los versos del poeta Manolo Chinato.
    body_md: |
      ## Qué encontrarás
      *Poesía básica* reconstruye la gestación de **Extrechinato y Tú**, el
      proyecto que musicalizó los versos del poeta Manolo Chinato con
      [Robe](/robe), Fito Cabrales e Iñaki «Uoho» Antón. Javier M. Alcaraz narra
      cómo una idea de 1996 acabó convertida en disco de oro en 2001.

      ## Por qué importa
      Ilumina una de las ramas más entrañables del árbol genealógico de
      [Extremoduro](/extremoduro): la conexión con Chinato, figura clave en la
      sensibilidad poética de Robe. Editado por Efe Eme en 2023, con varias
      reediciones posteriores.

      ## El autor y su relación con el universo Robe
      Javier M. Alcaraz (Javier Martínez Alcaraz, Almería, 1980) es periodista
      musical con más de veinte años de oficio, fundador de la web RockSesión
      (2012) y colaborador habitual de Efe Eme. Su obra orbita justo alrededor del
      universo de [Robe](/robe): *Poesía básica* cuenta la historia de Extrechinato
      y Tú, el disco que unió a Robe, Fito Cabrales e Iñaki «Uoho» Antón con el
      poeta Manolo Chinato.

      Su segundo libro, *Platero y Tú. Yo quiero rock and roll* (Efe Eme, 2025),
      retrata disco a disco a la banda de Fito y Uoho, otra rama del mismo árbol
      genealógico que [Extremoduro](/extremoduro), con el testimonio de sus cuatro
      miembros.

