      ## Qué encontrarás
      Un cuaderno monográfico que la revista *Efe Eme* dedicó por entero a
      [Extremoduro](/extremoduro): artículos, análisis y memoria del grupo
      reunidos en un volumen publicado en el verano de 2022.

      ## Por qué importa
      Es una pieza para fans: recopila firmas y enfoques periodísticos sobre la
      banda en formato revista-libro. Al tratarse de un número de revista lleva
      depósito legal en lugar de ISBN, y quedan pocas unidades en circulación.

      ## La colección
