# Vídeos relacionados del universo Robe / Extremoduro.
#
# NO confundir con el vídeo canónico de cada canción (eso vive en
# Song.youtube_id, vía scripts.match_youtube). Aquí caben colaboraciones,
# entrevistas y vídeos oficiales que involucran a Robe o a su entorno, anclados
# a una o más entidades por slug.
#
# Cada entrada:
#   youtube_id:  ID de YouTube (11 chars).
#   title:       título legible (mostrado en la card).
#   kind:        collaboration | interview | official | live
#   upload_date: fecha de subida (YYYY-MM-DD), opcional.
#   links:       slugs de entidades a las que se ancla el vídeo. Listas:
#                persons / artists / bands / songs.
#
# Idempotente por youtube_id: ver scripts.seed_related_videos.

