# Inventario de entrevistas/material para el corpus de voz de "Pregúntale al
# viento". Cada entrada se transcribe (vídeo: subtítulos→Whisper) o se ingiere
# (texto) como InterpretationSource y luego se vectoriza en robe_voice_v1.
#
# Campos:
#   url, title, author, date
#   medium: video | text   (video → scripts.transcribe_with_whisper --source-mode)
#   author_is_robe: true  → HABLA Robe (kind=robe_interview, núcleo del corpus)
#                   false → homenaje/análisis de TERCEROS (kind=about_robe,
#                           solo contexto, jamás citado como palabras de Robe)
#
# SOLO URLs verificadas. Ampliable: añadir más entrevistas reales y re-correr.

