# Fuentes de noticias unificadas — universo Robe Iniesta / Extremoduro.
#
# Este fichero sustituye a `news_whitelist.yaml` y a `entrenoticias/sources.py`:
# es la lista ÚNICA que alimenta el agregador (`scripts/news/aggregate.py`).
# El agregador descarga todas las fuentes habilitadas a la tabla `news_items`.
#
# Cada fuente lleva un campo `policy` que decide qué consumidor la usa:
#
#   blog+ig  →  el blog de entreinteriores.com PUEDE reescribir y publicar
#               contenido a partir de ella. Fuentes "limpias", curadas a mano.
#   ig-only  →  solo el pipeline de Instagram (que únicamente enlaza y atribuye
#               al medio original, uso tipo Google News). Incluye agregadores
#               y prensa comercial vetada por la línea editorial del blog
#               (Mondo Sonoro, Efe Eme) y Reddit.
#
# El veto del corpus (Mondo Sonoro / Efe Eme / Rockdelux para el blog, Reddit
# fuera del corpus) se respeta vía `policy`: esas fuentes nunca son `blog+ig`.
#
# Campos:
#   key      identificador estable (no cambiar; se guarda en news_items)
#   name     nombre legible del feed
#   kind     rss | gnews | html
#   url      URL del feed             (rss / html)
#   query    búsqueda de Google News  (gnews — el agregador construye la URL)
#   selector selector CSS del item    (html)
#   policy   blog+ig | ig-only
#   tier     trusted | review         (lo usa el consumidor del blog)
#   weight   peso de relevancia 0-1   (lo usa el selector de temas de Instagram)
#   enabled  true | false

# --------------------------------------------------------------------------- #
# Términos del universo — los usa el consumidor del blog para matchear noticias
# --------------------------------------------------------------------------- #
terms_groups:
  core:
    - robe iniesta
    - extremoduro
    - "robe"
  members:
    - uoho
    - iñaki antón
    - inaki anton
    - salo
    - miguel colino
    - luis von fanta
    - mariano garcía
    - kolibrí
  friends:
    - marea
    - kutxi romero
    - platero y tú
    - fito cabrales
    - reincidentes
    - manolo kabezabolo
    - rosendo
    - barricada
    - soziedad alkoholika
  tributes:
    - tributo extremoduro
    - tributo a extremoduro
    - tributo robe
    - homenaje extremoduro
    - banda tributo extremoduro

# --------------------------------------------------------------------------- #
# Configuración de relevancia — la usa el agregador y el selector de temas IG
# --------------------------------------------------------------------------- #
relevance:
  # Filtro mínimo: una noticia se guarda solo si menciona alguno de estos.
  must_mention:
    - extremoduro
    - robe iniesta
    - iniesta ojea
    - uoho
    - iñaki antón
  # Puntuación temática por palabra clave presente en titular + extracto.
  keywords:
    extremoduro: 5
    robe iniesta: 5
    robe: 3
    iniesta: 2
    uoho: 3
    iñaki antón: 3
    fito: 2
    plasencia: 2
    rock transgresivo: 3
    la ley innata: 3
    agila: 3
    deltoya: 3
    material defectuoso: 3
    mayéutica: 3
    bajo el hielo el fuego: 3
    gira: 2
    concierto: 2
    disco: 2
    álbum: 2
    extremadura: 1
    rock: 1
  # Bandas del entorno — para clasificar la categoría "Grupos amigos".
  friend_bands:
    - fito
    - platero y tú
    - platero
    - marea
    - barricada
    - porretas
    - boikot
    - los suaves
    - reincidentes
    - rosendo
    - lichis
    - la cabra mecánica
    - gritando en silencio

