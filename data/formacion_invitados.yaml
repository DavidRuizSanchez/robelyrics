    artista: extremoduro
    personas: [inaki-uoho-anton]
    fuente: "Ficha de «Pedrá» en entreinteriores.com y deprofundis_facts.md: Uoho grabó «Pedrá» (1993-1995) siendo aún de Platero y Tú; entra en Extremoduro en 1996"
