# Grupos / sellos afines al universo Robe-Extremoduro (sección /grupos).
#
# Pobla la tabla `bands`. El seed (`scripts.seed_bands`) completa desde
# Wikipedia/Wikidata: Q-ID, bio corta e imagen (P18). El contenido editorial
# de cada página lo genera `scripts.seo.generate_band_content` (con la regla de
# "nunca inventar"; modo low-data honesto si hay poca información).
#
# kind: band | label
# related_note: vínculo real con Robe/Extremoduro (nota interna de contexto).

bands:
  - slug: fito-y-fitipaldis
    name: Fito & Fitipaldis
    kind: band
    wikidata_id: Q3183879
    wikipedia_url: https://es.wikipedia.org/wiki/Fito_%26_Fitipaldis
    related_note: >
      Banda de Fito Cabrales. Extremoduro y Fito compartieron escenario y
      cartel; aparece en el círculo de rock estatal afín a Robe.

  - slug: marea
    name: Marea
    kind: band
    wikidata_id: Q1298620
    wikipedia_url: https://es.wikipedia.org/wiki/Marea_(banda)
    related_note: >
      Banda de Kutxi Romero, del círculo de rock estatal cercano a Extremoduro.

  - slug: platero-y-tu
    name: Platero y Tú
    kind: band
    wikidata_id: Q1215911
    wikipedia_url: https://es.wikipedia.org/wiki/Platero_y_T%C3%BA
    related_note: >
      Banda en la que tocó Fito Cabrales en los 90, hermanada con el rock de
      Extremoduro de la época.

  - slug: the-flying-rebollos
    name: The Flying Rebollos
    kind: band
    related_note: >
      Grupo mencionado en el entorno de Robe / Extremoduro.

  - slug: el-dromedario-records
    name: El Dromedario Records
    kind: label
    related_note: >
      Sello discográfico ligado a la obra en solitario de Robe Iniesta.

  - slug: leno
    name: Leño
    kind: band
    wikipedia_url: https://es.wikipedia.org/wiki/Le%C3%B1o
    related_note: >
      Banda de Rosendo Mercado, pilar del rock urbano español de los 70-80.
      Extremoduro bebe de esa tradición; Rosendo está en el círculo cercano.

  - slug: reincidentes
    name: Reincidentes
    kind: band
    wikipedia_url: https://es.wikipedia.org/wiki/Reincidentes
    related_note: >
      Punk-rock de Sevilla del mismo circuito de directos y festivales que
      Extremoduro en los 90.

  - slug: la-fuga
    name: La Fuga
    kind: band
    wikipedia_url: https://es.wikipedia.org/wiki/La_Fuga_(banda)
    related_note: >
      Rock de Reinosa (Cantabria), del circuito de rock estatal cercano a
      Extremoduro.

  - slug: nu
    name: Ñu
    kind: band
    wikipedia_url: https://es.wikipedia.org/wiki/%C3%91u_(banda)
    related_note: >
      Rock duro de José Carlos Molina, parte de la tradición del rock urbano
      que enlaza con el universo de Extremoduro.

  - slug: extrechinato-y-tu
    name: Extrechinato y tú
    kind: band
    wikipedia_url: https://es.wikipedia.org/wiki/Extrechinato_y_t%C3%BA
    related_note: >
      Proyecto del año 2000 alrededor del poeta Manolo Chinato, con Robe
      Iniesta, Fito Cabrales, Iñaki Antón y músicos del entorno de Extremoduro.
      Pieza clave para entender el universo de Robe.

  - slug: los-enemigos
    name: Los Enemigos
    kind: band
    wikipedia_url: https://es.wikipedia.org/wiki/Los_Enemigos
    related_note: >
      Banda madrileña de Josele Santiago, del rock estatal afín a Extremoduro.

  - slug: inconscientes
    name: Inconscientes
    kind: band
    wikipedia_url: https://es.wikipedia.org/wiki/Inconscientes_(banda)
    related_note: >
      Banda anterior de Iñaki "Uoho" Antón en Bilbao, antes de Platero y Tú y
      Extremoduro.

  - slug: dro
    name: DRO
    kind: label
    wikipedia_url: https://es.wikipedia.org/wiki/Discos_Radiactivos_Organizados
    related_note: >
      Sello discográfico histórico (Discos Radiactivos Organizados) de la
      movida y el rock estatal.
