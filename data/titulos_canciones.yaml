# Títulos de canción y de disco con mayúsculas a la española (David, 12-11-2026).
#
# Genius los trae en Title Case («Ábreme el Pecho y Registra») y se colaban en el
# H1, en los titles y en los cuerpos. Regla de la casa: mayúscula al principio,
# tras «:» y al abrir paréntesis o corchete; el resto en minúscula salvo nombres
# propios y siglas. Lo aplica `scripts/normalizar_titulos.py`, que comprueba que
# el título de la BD sigue siendo `antes` (si no, no toca nada). Los slugs no
# cambian: ninguna URL cambia. `ingest.py` ya no pisa el título de una canción
# que existe, así que esta lista no se deshace al reingestar.
#
# `revisar: true` = caso de criterio, enseñado a David antes de aplicar.

