# Medios reconocidos para el CORPUS (decisión de David, 23-10-2026).
#
# Cuenta la tele y la radio públicas y privadas, la prensa generalista, la
# especializada y el sector, incluidos Mondo Sonoro, Efe Eme y Rockdelux (se
# levanta el veto del corpus). Lo que publican entra como FONDO (se corrobora y
# no se nombra), salvo cuando quien habla es una voz de `corpus_voices.yaml` o
# de la BD.
#
# Canales de YouTube por `channel_id`, NUNCA por subcadena del nombre: cualquiera
# puede llamar a su canal «RTVE Archivo». Cada id se resolvió con la API de
# YouTube el 24-10-2026 (`channels.list` por handle, o `search.list` + ficha) y
# solo entra si la ficha acredita que es el canal del medio: se declara oficial,
# o su handle y su descripción coinciden con el medio, con país ES.
#
# `sweep: true` = el detector barre también sus subidas (Fase 2). De momento
# solo se usa para clasificar lo que encuentra la búsqueda.
#
# Pendientes, sin canal acreditado (no se añaden por suponerlo):
#   - Efe Eme: «Revista Efe Eme» (@revistaefeeme3826) tiene 24 suscriptores,
#     5 vídeos y ninguna descripción.
#   - HOY (@hoy_extremadura, 67 subs) y El Periódico Extremadura
#     (@periodicoextremadura, 57 subs): se describen como el medio, pero no hay
#     forma de saber si son los suyos.
#   - Maneras de Vivir: el canal homónimo es un programa de radio argentino.
#   - @abc es la cadena de EE. UU.: el del diario es @abc_es (añadido tras la
#     primera muestra, que trajo una entrevista a Uoho en «Diario ABC»).
#   - Telesur Madrid (tele local) y Orain Berriak (292 subs, sin descripción).

